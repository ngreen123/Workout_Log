<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Training Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one narrow column built for a phone at the gym. Workouts (routines you log into) and Exercises (progress per lift). */
:root {
  color-scheme: light;
  --bg: #f1f1f1;
  --surface: #ffffff;
  --ink: #0b0b0b;
  --ink-2: #3c3c3c;
  --ink-3: #6e6e6e;
  --line: #d4d4d4;
  --hover: #ebebeb;
  --bar: #0b0b0b;
  --bar-ink: #ffffff;
  --bar-ink-2: #9b9b9b;
  --accent: #4b9cd3;
  --accent-ink: #1f6aa5;
  --accent-wash: rgba(75, 156, 211, 0.14);
  --on-accent: #0b0b0b;
  --good: #0b0b0b;
  --good-wash: rgba(0, 0, 0, 0.07);
  --critical: #c4302b;
  --critical-wash: rgba(196, 48, 43, 0.09);
  --font-display: "Archivo", "Arial Black", Impact, sans-serif;
  --font-body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 3px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0b0b0b; --surface: #161616; --ink: #f3f3f3; --ink-2: #c6c6c6; --ink-3: #8e8e8e; --line: #2d2d2d; --hover: #1f1f1f;
    --bar: #000000; --bar-ink: #ffffff; --bar-ink-2: #8e8e8e;
    --accent: #7bafd4; --accent-ink: #9fc8e8; --accent-wash: rgba(123, 175, 212, 0.16); --on-accent: #0b0b0b;
    --good: #f3f3f3; --good-wash: rgba(255, 255, 255, 0.10); --critical: #ef6a64; --critical-wash: rgba(239, 106, 100, 0.14);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b0b0b; --surface: #161616; --ink: #f3f3f3; --ink-2: #c6c6c6; --ink-3: #8e8e8e; --line: #2d2d2d; --hover: #1f1f1f;
  --bar: #000000; --bar-ink: #ffffff; --bar-ink-2: #8e8e8e;
  --accent: #7bafd4; --accent-ink: #9fc8e8; --accent-wash: rgba(123, 175, 212, 0.16); --on-accent: #0b0b0b;
  --good: #f3f3f3; --good-wash: rgba(255, 255, 255, 0.10); --critical: #ef6a64; --critical-wash: rgba(239, 106, 100, 0.14);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
a { color: var(--accent-ink); }
.app { max-width: 860px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right)) calc(72px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
.mono, input.w, input.r, .tile-value, td.num, .set-n { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-size: 13px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* Header */
.top { position: sticky; top: 0; z-index: 5; background: var(--bar); box-shadow: 0 0 0 100vmax var(--bar); clip-path: inset(0 -100vmax); display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px; padding: calc(16px + env(safe-area-inset-top)) 0 0; border-bottom: 3px solid var(--accent); }
.brand { display: flex; align-items: baseline; gap: 12px; padding-bottom: 10px; }
.brand h1 { font-family: var(--font-display); font-weight: 900; font-stretch: 115%; font-size: 24px; letter-spacing: 0; text-transform: uppercase; line-height: 1; color: var(--bar-ink); }
.status { font-size: 12px; color: var(--bar-ink-2); display: inline-flex; align-items: center; gap: 6px; }
.status::before { content: ""; width: 7px; height: 7px; background: var(--bar-ink-2); opacity: .6; }
.status.ok::before { background: var(--bar-ink); opacity: 1; }
.status.busy::before { background: var(--accent); opacity: 1; }
.status.err { color: #ef6a64; }
.status.err::before { background: var(--critical); opacity: 1; }
.tabs { display: flex; gap: 4px; }
.tabs a { font-family: var(--font-display); font-weight: 800; font-stretch: 110%; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--bar-ink-2); text-decoration: none; padding: 8px 12px 12px; border-bottom: 3px solid transparent; margin-bottom: -3px; }
.tabs a:hover { color: var(--bar-ink); }
.tabs a[aria-current="page"] { color: var(--on-accent); background: var(--accent); border-bottom-color: var(--accent); }

#banner:empty { display: none; }
.banner { margin-top: 14px; padding: 10px 14px; border-radius: var(--radius); background: var(--accent-wash); font-size: 14px; }
.banner.warn { background: var(--critical-wash); }

/* Controls */
button, input, select, textarea { font: inherit; color: inherit; }
button, a, .chip { touch-action: manipulation; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 3px; padding: 8px 14px; font-weight: 500; cursor: pointer; min-height: 40px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-style: dashed; color: var(--accent-ink); }
.btn.ghost:hover { background: var(--accent-wash); border-color: var(--accent); }
.btn.danger { background: var(--critical); border-color: var(--critical); color: #fff; }
.btn.quiet-danger { color: var(--critical); }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .55; cursor: default; }
.icon-btn { appearance: none; border: 1px solid transparent; background: transparent; color: var(--ink-3); width: 36px; height: 36px; border-radius: 3px; cursor: pointer; font-size: 18px; line-height: 1; display: inline-grid; place-items: center; flex: none; }
.icon-btn:hover { background: var(--bg); color: var(--ink); border-color: var(--line); }
.icon-btn:disabled { opacity: .3; cursor: default; }
input[type="text"], input[type="search"], input[type="date"], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; min-height: 40px; width: 100%; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-wash); }
input::placeholder, textarea::placeholder { color: var(--ink-3); opacity: .75; }
textarea { resize: vertical; min-height: 64px; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
fieldset:disabled { opacity: .7; }
.lbl { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
.page { padding-top: 18px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.card h2, .card h3.card-title { font-family: var(--font-display); font-weight: 600; font-size: 20px; letter-spacing: .02em; }
.sub { margin: 2px 0 10px; color: var(--ink-3); font-size: 13px; }
.meta { color: var(--ink-3); font-size: 13px; }
.tag { display: inline-block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 2px; background: var(--accent-wash); color: var(--accent-ink); white-space: nowrap; }
.tag.good { background: var(--good-wash); color: var(--good); }
.tag.plain { background: var(--bg); color: var(--ink-2); border: 1px solid var(--line); }
.empty-box { border: 1px dashed var(--line); border-radius: var(--radius); padding: 22px 16px; color: var(--ink-2); background: var(--surface); }
.crumbs { font-size: 14px; margin-bottom: 10px; }
.crumbs a { text-decoration: none; font-weight: 500; }
.crumbs a:hover { text-decoration: underline; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 16px; margin-bottom: 14px; }
.page-title { font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: .01em; line-height: 1.1; }
.page-head .sub { margin: 2px 0 0; }

/* Workouts list */
.wk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.wk-card { display: flex; flex-direction: column; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--accent); border-radius: var(--radius); padding: 14px 16px; text-decoration: none; color: inherit; }
.wk-card:hover { border-color: var(--accent); }
.wk-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.wk-card h3 { font-family: var(--font-display); font-weight: 700; font-size: 23px; letter-spacing: .01em; line-height: 1.1; }
.wk-ex { margin: 4px 0 0; padding-left: 20px; font-size: 13px; color: var(--ink-2); display: flex; flex-direction: column; gap: 1px; }
.wk-ex li::marker { color: var(--ink-3); font-family: var(--font-mono); font-size: 11px; }
.wk-ex .alt-n { color: var(--ink-3); font-size: 12px; }
.wk-new { display: grid; place-items: center; min-height: 140px; border: 1px dashed var(--line); border-radius: var(--radius); background: transparent; color: var(--accent-ink); font-weight: 500; cursor: pointer; font-size: 15px; }
.wk-new:hover { background: var(--accent-wash); border-color: var(--accent); }
.foot-link { margin: 28px 0 0; text-align: center; font-size: 13px; }
.foot-link a { color: var(--ink-3); }

/* Workout detail: log */
.wd-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 10px 16px; }
.wd-note { margin: 4px 0 0; color: var(--ink-2); font-size: 14px; }
.date-bar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 16px; margin: 16px 0 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.date-nav { display: flex; align-items: center; gap: 6px; }
.date-nav input { width: auto; }
.day-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.day-line strong { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: .01em; }
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 12px 12px 14px; border-left: 4px solid var(--line); }
.ex.logged { border-left-color: var(--accent); }
.ex-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.ex-num { font-family: var(--font-display); font-weight: 700; font-size: 20px; color: var(--ink-3); width: 22px; flex: none; }
.ex-title { font-size: 17px; font-weight: 600; }
.ex-link { margin-left: auto; font-size: 13px; text-decoration: none; font-weight: 500; }
.ex-link:hover { text-decoration: underline; }
.ex-body { margin-left: 30px; }
.swap { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; color: var(--ink-3); }
.swap select { width: auto; max-width: 100%; min-height: 34px; padding: 4px 8px; font-size: 14px; color: var(--ink); }
.cue { margin: 8px 0 0; font-size: 13px; color: var(--ink-2); }
.cue-l { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin-right: 6px; }
.hint { margin: 8px 0 6px; font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
.hint-last { color: var(--ink-3); }
.hint-target b { color: var(--accent-ink); font-family: var(--font-mono); font-weight: 500; }
.sets { margin: 4px 0 8px; display: flex; flex-direction: column; gap: 6px; }
.set-row { display: grid; grid-template-columns: 34px minmax(64px, 120px) 14px minmax(56px, 100px) 34px; gap: 6px; align-items: center; }
.set-row.head { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; }
.set-row.head span:nth-child(2), .set-row.head span:nth-child(4) { text-align: right; }
.set-n { color: var(--ink-3); font-family: var(--font-mono); font-size: 13px; text-align: center; border-radius: 2px; padding: 2px 0; }
.set-n.pr { background: var(--good-wash); color: var(--good); font-family: var(--font-body); font-size: 11px; font-weight: 700; letter-spacing: .04em; }
.set-row input { width: 100%; text-align: right; font-family: var(--font-mono); font-size: 16px; padding: 6px 8px; min-height: 40px; background: var(--bg); border: 1px dashed var(--line); border-radius: 3px; color: var(--ink-3); }
.set-row.done input { color: var(--ink); border-style: solid; background: var(--surface); }
.set-row input:focus { background: var(--surface); color: var(--ink); }
.x { color: var(--ink-3); text-align: center; }
.set-row.done .ex-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.recent td { cursor: pointer; }
.recent tr.current td { background: var(--accent-wash); }

.extras { margin-top: 26px; padding-top: 16px; border-top: 3px solid var(--ink); }
.extras .sub { margin-bottom: 12px; }
.extras #extraRows:not(:empty) { margin-bottom: 12px; }
.add-extra { display: flex; gap: 8px; align-items: flex-start; }
/* Workout detail: edit */
.ed-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.ed-top { display: flex; align-items: center; gap: 6px; }
.ed-top .ed-name { font-weight: 600; flex: 1; min-width: 0; }
.ed-top .icon-btn { width: 30px; }
h3.card-title { font-family: var(--font-display); font-weight: 900; font-stretch: 112%; text-transform: uppercase; }
.ed-grid { display: grid; grid-template-columns: minmax(0, 420px); gap: 10px 14px; margin: 10px 0 2px 28px; }
.ed-note { min-height: 34px; padding: 4px 8px; font-size: 14px; }
.edit-bar { position: sticky; bottom: 0; background: var(--bg); display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); margin-top: 16px; z-index: 14; }
.edit-bar .spacer { flex: 1; }
.form-msg { font-size: 13px; color: var(--critical); }
.help { font-size: 13px; color: var(--ink-3); margin: 8px 0 0; }

/* Exercises list */
.filters { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chip { appearance: none; flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 2px; padding: 6px 12px; cursor: pointer; font-size: 14px; white-space: nowrap; min-height: 36px; }
.chip:hover { border-color: var(--ink-3); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.range .chip { padding: 4px 10px; min-height: 32px; font-size: 13px; }
.ex-list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.ex-item { border-bottom: 1px solid var(--line); }
.ex-item:last-child { border-bottom: 0; }
.ex-line { display: flex; align-items: center; }
.ex-row { flex: 1; min-width: 0; display: grid; grid-template-columns: 1fr auto 80px; gap: 12px; align-items: center; padding: 11px 6px 11px 14px; text-decoration: none; color: inherit; }
.ex-line:hover { background: var(--accent-wash); }
.ex-del { margin-right: 6px; }
.ex-del svg, .ex-ren svg { width: 16px; height: 16px; }
.ex-ren { margin-right: -4px; }
.btn svg { width: 15px; height: 15px; }
.exd-title { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.ex-row-name { font-weight: 600; display: block; }
.ex-row-meta { font-size: 12px; color: var(--ink-3); }
.ex-row-stat { text-align: right; font-size: 13px; }
.ex-row-stat .mono { color: var(--ink); }
.ex-row-stat .none { color: var(--ink-3); }
.spark { display: block; }
.spark-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.spark-dot { fill: var(--accent); }
.spark-none { stroke: var(--line); stroke-width: 2; stroke-dasharray: 0; }

/* Exercise detail */
input.title-input { font-family: var(--font-display); font-size: 30px; font-weight: 700; letter-spacing: .01em; border: 1px solid transparent; background: transparent; border-radius: 3px; padding: 2px 6px; margin-left: -7px; width: 100%; min-height: 0; }
input.title-input:hover { border-color: var(--line); }
.used { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0 12px; font-size: 13px; color: var(--ink-3); }
.used a { text-decoration: none; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.tile-label { font-size: 12px; color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.tile-value { font-family: var(--font-display); font-size: 32px; font-weight: 700; line-height: 1.1; margin-top: 2px; }
.tile-value small { font-family: var(--font-body); font-size: 14px; font-weight: 500; color: var(--ink-3); margin-left: 3px; }
.tile-sub { font-size: 12px; color: var(--ink-3); }
.delta { font-size: 13px; font-weight: 500; display: inline-flex; gap: 4px; align-items: center; }
.delta.up { color: var(--good); }
.delta.down { color: var(--critical); }
.delta.flat { color: var(--ink-3); }
.chart { position: relative; width: 100%; min-height: 220px; }
.chart svg { display: block; overflow: visible; }
.ax-text { fill: var(--ink-3); font-family: var(--font-body); font-size: 11px; }
.end-text { fill: var(--ink); font-family: var(--font-mono); font-size: 12px; font-weight: 500; }
.grid-line { stroke: var(--line); stroke-width: 1; }
.base-line { stroke: var(--ink-3); stroke-width: 1; opacity: .6; }
.series-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.series-area { fill: var(--accent); opacity: .10; }
.series-dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.series-bar { fill: var(--accent); }
.series-bar.dim { opacity: .45; }
.cross { stroke: var(--ink-3); stroke-width: 1; }
.hit { fill: transparent; cursor: crosshair; }
.tip { position: absolute; pointer-events: none; z-index: 2; min-width: 140px; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; box-shadow: 0 6px 20px rgba(0,0,0,.14); font-size: 12px; color: var(--ink-2); display: none; }
.tip strong { display: block; color: var(--ink); font-size: 13px; margin-bottom: 2px; }
.tip .v { font-family: var(--font-mono); color: var(--ink); }
.empty { color: var(--ink-3); padding: 24px 0; margin: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; }
tr.link { cursor: pointer; }
tr.link:hover td { background: var(--accent-wash); }

@media (max-width: 520px) {
  .brand h1 { font-size: 26px; }
  .tabs a { font-size: 15px; padding: 8px 10px 12px; }
  .ex-body { margin-left: 0; }
  .set-row { grid-template-columns: 30px 1fr 10px 1fr 34px; gap: 5px; }
  .ed-grid { grid-template-columns: 1fr; margin-left: 0; }
  .ex-row { grid-template-columns: 1fr auto; }
  .ex-row .spark { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .btn, .chip, .icon-btn, .wk-card { transition: background-color .12s, border-color .12s, color .12s; }
}

/* Confirm dialog */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .55); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
.modal-box { width: min(420px, 100%); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-top: 5px solid var(--critical); border-radius: 3px; padding: 20px; box-shadow: 0 16px 40px rgba(0, 0, 0, .3); }
.modal-box h2 { font-family: var(--font-display); font-weight: 900; font-stretch: 112%; text-transform: uppercase; font-size: 18px; margin: 0 0 8px; }
.modal-box p { margin: 0 0 18px; color: var(--ink-2); font-size: 15px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
.modal-actions .btn { min-width: 96px; justify-content: center; }
.modal-box.ask { border-top-color: var(--accent); }
#modalInput { margin: 0 0 8px; font-size: 16px; font-weight: 600; }
#modalErr { margin: 0 0 12px; }
/* Exercise name suggestions (inline, so the page keeps scrolling) */
.pick { position: relative; flex: 1; min-width: 0; }
.pick .ex-pick { padding-right: 42px; }
.pick-toggle { position: absolute; top: 1px; right: 1px; bottom: 1px; width: 38px; display: grid; place-items: center; appearance: none; border: 0; border-left: 1px solid var(--line); border-radius: 0 3px 3px 0; background: transparent; color: var(--ink-2); cursor: pointer; }
.pick-toggle:hover { background: var(--hover); color: var(--ink); }
.pick-toggle svg { width: 12px; height: 12px; }
.pick.open .pick-toggle svg { transform: rotate(180deg); }
.pick-list { position: absolute; left: 0; right: 0; top: calc(100% + 2px); z-index: 12; background: var(--surface); border: 1px solid var(--ink-3); border-radius: 3px; box-shadow: 0 8px 20px rgba(0,0,0,.15); max-height: 280px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.pick-opt { display: block; width: 100%; text-align: left; appearance: none; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--ink); padding: 10px 12px; font: inherit; font-size: 15px; cursor: pointer; }
.pick-opt:last-child { border-bottom: 0; }
.pick-list.up { top: auto; bottom: calc(100% + 2px); }
.pick-opt:hover, .pick-opt.active { background: var(--accent-wash); }
.pick-opt.current { font-weight: 700; box-shadow: inset 4px 0 0 var(--accent); }
.pick-opt small { color: var(--ink-3); margin-left: 6px; }
/* Blocky display type */
.page-title, .card h2, .card h3.card-title, .wk-card h3, .day-line strong, input.title-input, .week-head h3 { font-family: var(--font-display); font-weight: 900; font-stretch: 112%; text-transform: uppercase; letter-spacing: 0; }
.page-title { font-size: 24px; }
.card h2, .card h3.card-title { font-size: 16px; }
.wk-card h3 { font-size: 19px; }
.day-line strong { font-size: 17px; }
input.title-input { font-size: 24px; }
.ex-num { font-family: var(--font-display); font-weight: 900; font-size: 16px; color: var(--ink-3); }
.ex-title { font-weight: 800; font-size: 16px; text-transform: uppercase; letter-spacing: .01em; }
.tile-value { font-family: var(--font-display); font-weight: 900; font-stretch: 105%; font-size: 28px; }
.lbl, .tile-label, th, .set-row.head { font-weight: 700; }
.btn { font-weight: 700; }
.btn.primary { text-transform: uppercase; letter-spacing: .04em; font-size: 14px; }
.wk-card { border: 1px solid var(--line); border-top: 5px solid var(--ink); }
.wk-card:hover { border-color: var(--ink); border-top-color: var(--accent); }
.ex.logged { border-left-color: var(--accent); }
.set-n.pr { background: var(--accent); color: var(--on-accent); }
.tag.good { background: var(--ink); color: var(--surface); }
.delta.up { color: var(--ink); }
.delta.down { color: var(--ink-3); }
.ex-line:hover, tr.link:hover td { background: var(--hover); }
.recent tr.current td { background: var(--hover); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.set-row.done input { border-color: var(--ink-3); }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Training Log</h1>
      <span class="status" id="status" role="status" aria-live="polite">Connecting…</span>
    </div>
    <nav class="tabs" aria-label="Sections">
      <a href="#workouts" data-tab="workouts">Workouts</a>
      <a href="#exercises" data-tab="exercises">Exercises</a>
    </nav>
  </header>
  <div id="banner"></div>
  <main>
    <section class="page" id="pWorkouts" aria-label="Workouts"></section>
    <section class="page" id="pWorkout" aria-label="Workout" hidden></section>
    <section class="page" id="pExercises" aria-label="Exercises" hidden></section>
    <section class="page" id="pExercise" aria-label="Exercise progress" hidden></section>
    <section class="page" id="pBackup" aria-label="Backup and restore" hidden></section>
  </main>
  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="alertdialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalBody">
      <h2 id="modalTitle"></h2>
      <p id="modalBody"></p>
      <label class="sr" for="modalInput">Name</label>
      <input type="text" id="modalInput" autocomplete="off" hidden>
      <p id="modalErr" class="form-msg" hidden></p>
      <div class="modal-actions">
        <button type="button" class="btn" id="modalCancel">Cancel</button>
        <button type="button" class="btn danger" id="modalOk">Delete</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  const DAY = 86400000;
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const norm = s => String(s || "").trim().replace(/\s+/g, " ").toLowerCase();
  const tidy = s => String(s || "").trim().replace(/\s+/g, " ");
  const str = (v, n) => typeof v === "string" ? v.slice(0, n) : "";
  const num = v => { const n = parseFloat(String(v == null ? "" : v).replace(",", ".")); return isFinite(n) ? n : 0; };
  const toStr = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const todayStr = () => toStr(new Date());
  const parseDate = s => { const p = s.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); };
  const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return toStr(d); };
  const fmtDate = (s, o) => parseDate(s).toLocaleDateString(undefined, o || { weekday: "short", month: "short", day: "numeric" });
  const fmtW = w => (Math.round(w * 10) / 10).toLocaleString();
  const fmtInt = v => Math.round(v).toLocaleString();
  const e1rm = (w, r) => (!(r > 0) || !(w > 0)) ? 0 : (r === 1 ? w : w * (1 + r / 30));
  const isDate = s => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s);
  const rid = () => Math.random().toString(36).slice(2, 8);
  const slugify = s => norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40) || "item";
  const stepFor = w => w < 25 ? 2.5 : 5;
  const store = {
    get(k, d) { try { const v = localStorage.getItem("tl:" + k); return v == null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("tl:" + k, v); } catch (e) { /* ignore */ } }
  };

  // ---------- State ----------
  let db = null, readOnly = false, errorNote = "", loadNote = "";
  const got = { exercises: false, workouts: false, logs: false };
  const fresh = new Set();
  const isLoaded = () => got.exercises && got.workouts && got.logs;
  let EX = new Map();   // id -> {id, name, note}
  let WK = new Map();   // id -> {id, name, note, order, items:[{ex, alts:[], note}]}
  let LOGS = new Map(); // id -> {id, date, workoutId, workoutName, note, entries:[{ex, name, sets:[{w,r}]}]}
  let HIST = new Map(); // exercise id -> [summary per date]
  let page = "workouts", pageId = "", mode = "log";
  let sess = null;
  const drafts = new Map();
  let pendingDate = null;
  const lastWritten = new Map();
  let dirty = false, saving = false, savePending = false, saveTimer = null, savingP = Promise.resolve(), retries = 0;
  let exFilter = store.get("exFilter", "all"), exSearch = "", progRange = store.get("range", "all");

  // ---------- Sanitize ----------
  const sEx = (id, v) => ({ id, name: tidy(str(v.name, 80)) || "Untitled exercise", note: str(v.note, 300) });
  const sWk = (id, v) => {
    const items = [], seen = new Set();
    const add = (ex, note) => { if (typeof ex === "string" && ex && !seen.has(ex)) { seen.add(ex); items.push({ ex, alts: [], note }); } };
    (Array.isArray(v.items) ? v.items : []).forEach(it => {
      if (!it) return;
      add(it.ex, str(it.note, 120));
      (Array.isArray(it.alts) ? it.alts : []).forEach(a => add(a, ""));
    });
    return { id, name: tidy(str(v.name, 80)) || "Untitled workout", note: str(v.note, 300), order: num(v.order), items };
  };
  const sLog = (id, v) => ({
    id, date: isDate(v.date) ? v.date : id.slice(0, 10), workoutId: str(v.workoutId, 100), workoutName: str(v.workoutName, 80), note: str(v.note, 2000),
    entries: Array.isArray(v.entries) ? v.entries.filter(e => e && typeof e.ex === "string").map(e => ({
      ex: e.ex, name: str(e.name, 80),
      sets: Array.isArray(e.sets) ? e.sets.map(s => ({ w: Math.max(0, num(s && s.w)), r: Math.max(0, Math.round(num(s && s.r))) })).filter(s => s.r > 0 || s.w > 0) : []
    })).filter(e => e.sets.length) : []
  });

  const exName = (id, fb) => (EX.get(id) || {}).name || fb || "Removed exercise";
  const workoutsSorted = () => [...WK.values()].sort((a, b) => a.order - b.order || a.name.localeCompare(b.name));
  const tplKey = w => JSON.stringify(w ? w.items : null);
  const bodyKey = b => JSON.stringify({ n: b.note || "", e: b.entries.map(e => [e.ex, e.sets.map(s => [s.w, s.r])]) });

  function summarize(date, sets) {
    let best = null, vol = 0, reps = 0, maxW = 0, maxR = 0;
    sets.forEach(st => {
      const e = e1rm(st.w, st.r);
      vol += st.w * st.r; reps += st.r; maxW = Math.max(maxW, st.w); maxR = Math.max(maxR, st.r);
      if (!best || e > best.e || (e === best.e && st.r > best.r)) best = { w: st.w, r: st.r, e };
    });
    return { date, sets, best, vol, reps, maxW, maxR };
  }
  function buildHist() {
    const h = new Map();
    [...LOGS.values()].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0).forEach(l => {
      l.entries.forEach(e => {
        const sets = e.sets.filter(s => s.r > 0);   // a set counts toward progress once it has reps
        if (!sets.length) return;
        if (!h.has(e.ex)) h.set(e.ex, new Map());
        const byDate = h.get(e.ex);
        if (!byDate.has(l.date)) byDate.set(l.date, { date: l.date, sets: [], logs: [] });
        const d = byDate.get(l.date);
        d.sets.push(...sets);
        if (!d.logs.some(x => x.id === l.id)) d.logs.push({ id: l.id, wid: l.workoutId, wname: (WK.get(l.workoutId) || {}).name || l.workoutName || "Workout" });
      });
    });
    HIST = new Map();
    h.forEach((byDate, ex) => HIST.set(ex, [...byDate.values()].map(d => Object.assign(summarize(d.date, d.sets), { logs: d.logs }))));
  }
  function priorFor(ex, date) {
    const h = HIST.get(ex); if (!h) return null;
    const prior = h.filter(s => s.date < date); if (!prior.length) return null;
    let bestE = 0, bestR0 = 0;
    prior.forEach(s => s.sets.forEach(st => { bestE = Math.max(bestE, e1rm(st.w, st.r)); if (st.w === 0) bestR0 = Math.max(bestR0, st.r); }));
    return { last: prior[prior.length - 1], bestE, bestR0 };
  }
  function usedInMap() {
    const m = new Map();
    workoutsSorted().forEach(w => w.items.forEach(it => [it.ex, ...it.alts].forEach(id => {
      if (!m.has(id)) m.set(id, []);
      if (!m.get(id).includes(w)) m.get(id).push(w);
    })));
    return m;
  }
  const logsFor = wid => [...LOGS.values()].filter(l => l.workoutId === wid).sort((a, b) => a.date < b.date ? 1 : -1);
  const setsText = (sets, bw) => sets.map(st => bw ? String(st.r) : fmtW(st.w) + "×" + st.r).join(" · ") + (bw ? " reps" : "");

  // ---------- Status ----------
  function setStatus(text, kind) { const el = $("#status"); el.textContent = text; el.className = "status" + (kind ? " " + kind : ""); }
  let stallNote = "";
  function renderBanner() {
    const n = errorNote || stallNote || loadNote;
    $("#banner").innerHTML = n ? `<div class="banner warn">${esc(n)}</div>` : "";
  }

  // ---------- Dialog (confirm, or ask for a name) ----------
  let modalResolve = null, modalReturn = null, modalCfg = null;
  function openModal(cfg) {
    if (modalResolve) closeModal(cfg.input == null ? false : null);
    return new Promise(res => {
      modalResolve = res; modalReturn = document.activeElement; modalCfg = cfg;
      $("#modalTitle").textContent = cfg.title; $("#modalBody").textContent = cfg.body || "";
      const ok = $("#modalOk"), inp = $("#modalInput"), box = $(".modal-box"), m = $("#modal");
      ok.textContent = cfg.ok || "Delete"; ok.className = "btn " + (cfg.danger ? "danger" : "primary");
      box.classList.toggle("ask", !cfg.danger);
      inp.hidden = cfg.input == null; inp.value = cfg.input == null ? "" : cfg.input;
      $("#modalErr").hidden = true;
      // If the page is shown as one tall frame (no inner scrolling), open the dialog next to the button that was tapped.
      const tall = window.innerHeight > (screen.availHeight || screen.height || 1200) + 60;
      const r = modalReturn && modalReturn.getBoundingClientRect ? modalReturn.getBoundingClientRect() : null;
      if (tall && r) { m.style.alignItems = "start"; box.style.marginTop = Math.max(16, Math.min(r.top - 140, window.innerHeight - 320)) + "px"; }
      else { m.style.alignItems = ""; box.style.marginTop = ""; }
      m.hidden = false;
      const first = cfg.input == null ? $("#modalCancel") : inp;
      try { first.focus({ preventScroll: tall }); } catch (e) { first.focus(); }
      if (cfg.input != null) inp.select();
      if (tall) try { box.scrollIntoView({ block: "nearest" }); } catch (e) { /* ignore */ }
    });
  }
  const confirmDialog = (title, body, okLabel) => openModal({ title, body, ok: okLabel || "Delete", danger: true });
  const askDialog = (title, body, value, okLabel, validate) => openModal({ title, body, ok: okLabel || "Save", danger: false, input: value || "", validate });
  function closeModal(v) {
    $("#modal").hidden = true;
    const r = modalResolve; modalResolve = null; modalCfg = null;
    if (modalReturn && modalReturn.isConnected) try { modalReturn.focus(); } catch (e) { /* ignore */ }
    if (r) r(v);
  }
  function modalOk() {
    if (!modalCfg) return;
    if (modalCfg.input == null) return closeModal(true);
    const v = tidy($("#modalInput").value), err = modalCfg.validate ? modalCfg.validate(v) : "";
    if (err) { const el = $("#modalErr"); el.textContent = err; el.hidden = false; $("#modalInput").focus(); return; }
    closeModal(v);
  }
  const modalCancel = () => closeModal(modalCfg && modalCfg.input != null ? null : false);
  $("#modalOk").addEventListener("click", modalOk);
  $("#modalInput").addEventListener("input", () => { $("#modalErr").hidden = true; });
  $("#modalCancel").addEventListener("click", modalCancel);
  $("#modal").addEventListener("click", e => { if (e.target.id === "modal") modalCancel(); });
  document.addEventListener("keydown", e => {
    if ($("#modal").hidden) return;
    if (e.key === "Escape") modalCancel();
    else if (e.key === "Enter" && e.target.id === "modalInput") { e.preventDefault(); modalOk(); }
    else if (e.key === "Tab") {
      const f = $$(".modal-box input:not([hidden]), .modal-box button"), i = f.indexOf(document.activeElement);
      if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
      else if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
    }
  });

  // ---------- Exercise picker ----------
  // A list that lives in the page (not a browser popup), so the page keeps scrolling. ▾ shows every exercise; typing narrows it.
  const CARET = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function pickMatches(q, showAll) {
    const all = [...EX.values()].sort((a, b) => a.name.localeCompare(b.name));
    const k = norm(q);
    if (!k || (showAll && all.some(x => norm(x.name) === k))) return all;
    const starts = all.filter(x => norm(x.name).startsWith(k)), inner = all.filter(x => !norm(x.name).startsWith(k) && norm(x.name).includes(k));
    return starts.concat(inner);
  }
  function hidePick(input) {
    const w = input && input.closest(".pick"); if (!w) return;
    const l = $(".pick-list", w); if (l) l.remove();
    w.classList.remove("open");
  }
  const hideAllPicks = except => $$(".pick.open").forEach(w => { if (w !== except) hidePick($("input", w)); });
  function showPick(input, showAll) {
    const w = input.closest(".pick"); if (!w) return;
    hideAllPicks(w); hidePick(input);
    const ms = pickMatches(input.value, showAll);
    if (!ms.length || (!showAll && ms.length === 1 && norm(ms[0].name) === norm(input.value))) return;
    const cur = norm(input.value);
    const l = document.createElement("div"); l.className = "pick-list"; l.setAttribute("role", "listbox");
    l.innerHTML = ms.map(x => `<button type="button" class="pick-opt${norm(x.name) === cur ? " current" : ""}" role="option" aria-selected="${norm(x.name) === cur}" data-name="${esc(x.name)}" tabindex="-1">${esc(x.name)}</button>`).join("");
    w.appendChild(l); w.classList.add("open");
    // open upward when there's no room below (e.g. above the Save bar)
    const bar = $(".edit-bar"), barH = bar && bar.isConnected ? bar.getBoundingClientRect().height : 0;
    const ir = input.getBoundingClientRect(), below = window.innerHeight - barH - ir.bottom, above = ir.top - 70;
    if (l.offsetHeight > below - 8 && above > below) { l.classList.add("up"); l.style.maxHeight = Math.max(140, Math.min(280, above - 8)) + "px"; }
    else if (l.offsetHeight > below - 8) l.style.maxHeight = Math.max(140, below - 8) + "px";
    const c = $(".pick-opt.current", l); if (c) c.scrollIntoView({ block: "nearest" });
  }
  function choosePick(input, name) {
    input.value = name; hidePick(input);
    input.dispatchEvent(new CustomEvent("input", { bubbles: true, detail: "pick" }));
    if (input.id === "extraName") addExtra(name);
  }
  document.addEventListener("input", e => { if (e.target.classList && e.target.classList.contains("ex-pick") && e.detail !== "pick") showPick(e.target, false); });
  let lastPointer = "mouse";
  document.addEventListener("pointerdown", e => {
    lastPointer = e.pointerType || "mouse";
    const t = e.target;
    // a mouse press on the list or ▾ shouldn't take focus away from the box
    if (lastPointer === "mouse" && t.closest && t.closest(".pick-opt, .pick-toggle")) e.preventDefault();
    if (!(t.closest && t.closest(".pick-list, .pick-toggle"))) hideAllPicks(t.closest ? t.closest(".pick") : null);
  });
  // Pick on a completed tap, so dragging a finger to scroll the list never picks anything.
  document.addEventListener("click", e => {
    const t = e.target;
    const o = t.closest && t.closest(".pick-opt");
    if (o) { e.preventDefault(); e.stopPropagation(); choosePick($("input", o.closest(".pick")), o.dataset.name); return; }
    const tog = t.closest && t.closest(".pick-toggle");
    if (tog) {
      e.preventDefault(); e.stopPropagation();
      const w = tog.closest(".pick"), input = $("input", w);
      if (w.classList.contains("open")) hidePick(input);
      else {
        showPick(input, true);
        // on a phone, leave the keyboard down so it doesn't cover the list
        if (lastPointer === "mouse") try { input.focus({ preventScroll: true }); } catch (err) { input.focus(); }
      }
    }
  }, true);
  document.addEventListener("keydown", e => {
    const t = e.target; if (!t.classList || !t.classList.contains("ex-pick")) return;
    const w = t.closest(".pick"), l = $(".pick-list", w), opts = l ? $$(".pick-opt", l) : [], cur = opts.findIndex(o => o.classList.contains("active"));
    if ((e.key === "ArrowDown" || e.key === "ArrowUp") && !opts.length) { e.preventDefault(); showPick(t, true); return; }
    if ((e.key === "ArrowDown" || e.key === "ArrowUp") && opts.length) {
      e.preventDefault(); const n = (cur + (e.key === "ArrowDown" ? 1 : -1) + opts.length) % opts.length;
      opts.forEach((o, i) => o.classList.toggle("active", i === n)); opts[n].scrollIntoView({ block: "nearest" });
    } else if (e.key === "Enter" && cur >= 0) { e.preventDefault(); e.stopPropagation(); choosePick(t, opts[cur].dataset.name); }
    else if (e.key === "Escape" && l) { e.stopPropagation(); hidePick(t); }
    else if (e.key === "Tab") hidePick(t);
  }, true);

  // ---------- Local safety copy: every entry is kept on this device until the log confirms it ----------
  const BK = "tl:pending:";
  function writeBackup(logId, body) { try { localStorage.setItem(BK + logId, JSON.stringify({ body, at: Date.now() })); } catch (e) { /* storage unavailable */ } }
  function readBackup(logId) { try { const v = JSON.parse(localStorage.getItem(BK + logId)); if (v && Date.now() - v.at < 2 * DAY) return v; } catch (e) { /* ignore */ } return null; }
  function clearBackup(logId) { try { localStorage.removeItem(BK + logId); } catch (e) { /* ignore */ } }

  // ---------- Saving a session ----------
  const hhmm = () => new Date().toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  function markDirty() {
    if (readOnly || !db || !sess) return;
    dirty = true; setStatus("Saving…", "busy");
    writeBackup(sess.logId, cleanedSess(sess));
    clearTimeout(saveTimer); saveTimer = setTimeout(save, 500);
  }
  function cleanedSess(s) {
    const entries = s.rows.map(r => ({
      ex: r.ex, name: exName(r.ex, r.name),
      sets: r.sets.filter(st => st.done).map(st => ({ w: Math.max(0, Math.round(num(st.w) * 100) / 100), r: Math.max(0, Math.round(num(st.r))) })).filter(st => st.r > 0 || st.w > 0)

  // ---------- Build a session (one workout on one date) ----------

  // ---------- Exercises list ----------
  function spark(h, bw) {
    const pts = (h || []).slice(-12).map(s => bw ? s.maxR : s.best.e);
    const W = 80, H = 26;
    if (pts.length < 2) return `<svg class="spark" width="${W}" height="${H}" aria-hidden="true"></svg>`;
    const lo = Math.min(...pts), hi = Math.max(...pts), sp = hi - lo || 1;
    const xy = pts.map((v, i) => [3 + i / (pts.length - 1) * (W - 6), 3 + (1 - (v - lo) / sp) * (H - 6)]);
    const l = xy[xy.length - 1];
    return `<svg class="spark" width="${W}" height="${H}" aria-hidden="true"><polyline class="spark-line" points="${xy.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ")}"/><circle class="spark-dot" cx="${l[0]}" cy="${l[1]}" r="3"/></svg>`;
  }

  const PENCIL = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M13.5 3.5l3 3L7 16H4v-3z M11.5 5.5l3 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>';

  // ---------- Charts ----------
  function niceTicks(min, max, count) {
    if (min === max) { min -= 1; max += 1; }
    const step0 = (max - min) / count, mag = Math.pow(10, Math.floor(Math.log10(step0))), err = step0 / mag;
    const step = (err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1) * mag;
    const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, ticks = [];
    for (let v = lo; v <= hi + step / 2; v += step) ticks.push(Math.round(v * 1e6) / 1e6);
    return { lo, hi, ticks };
  }
  const fmtTick = (v, compact) => compact ? (v === 0 ? "0" : (v / 1000).toLocaleString() + "K") : v.toLocaleString();
  const xLabelFmt = spanDays => t => new Date(t).toLocaleDateString(undefined, spanDays > 300 ? { month: "short", year: "2-digit" } : { month: "short", day: "numeric" });
  function pickLabels(xs, gap) {
    const keep = [];
    xs.forEach((x, i) => { if (!keep.length || x - xs[keep[keep.length - 1]] >= gap) keep.push(i); });
    const last = xs.length - 1;
    if (keep[keep.length - 1] !== last) { if (keep.length > 1 && xs[last] - xs[keep[keep.length - 1]] < gap) keep.pop(); keep.push(last); }
    return keep;
  }
  function showTip(el, html, px, py, W) {

    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = px + 12; if (left + tw > W) left = px - tw - 12; if (left < 0) left = 0;
    let top = py - th - 10; if (top < 0) top = py + 12;
    tip.style.left = left + "px"; tip.style.top = top + "px";
  }
  const hideTip = el => { const t = $(".tip", el); if (t) t.style.display = "none"; };

      return { docs, size: docs.length, empty: !docs.length, metadata: { fromCache: false, hasPendingWrites: false }, docChanges: () => [] };
    };
    const emit = c => setTimeout(() => subs[c].slice().forEach(f => { try { f(snap(c)); } catch (e) { console.error(e); } }), 0);
    const write = (c, id, v) => new Promise((res, rej) => {
      const had = Object.prototype.hasOwnProperty.call(data[c], id), prev = data[c][id];
      if (v === undefined) delete data[c][id]; else data[c][id] = JSON.parse(JSON.stringify(v));
      try { persist(); } catch (e) {
        if (had) data[c][id] = prev; else delete data[c][id];
        return rej({ code: "quota_exceeded", message: String(e) });
      }
      emit(c); res();
    });
    // another tab of the app changed the data
    window.addEventListener("storage", e => { if (e.key === KEY) { data = load(); COLS.forEach(emit); } });
    return {
      collection: c => ({ onSnapshot(next) { subs[c].push(next); emit(c); return () => { subs[c] = subs[c].filter(f => f !== next); }; } }),
      doc: p => {
        const [c, id] = p.split("/");
        if (!COLS.includes(c) || !ID_OK.test(id || "")) throw new TypeError("Bad path " + p);
        return { set: v => write(c, id, v), delete: () => write(c, id, undefined) };
      },
      exportAll: () => JSON.parse(JSON.stringify(data)),
      replaceAll: d => { const prev = data; data = d; try { persist(); } catch (e) { data = prev; throw e; } COLS.forEach(emit); },
      counts: () => ({ workouts: Object.keys(data.workouts).length, exercises: Object.keys(data.exercises).length, logs: Object.keys(data.logs).length })
    };
  })();

  // ---------- Backup & restore ----------
  const LAST_BK = "lastBackup";
  function backupPayload() { return Object.assign({ app: "training-log", version: 1, exportedAt: new Date().toISOString() }, LocalDB.exportAll()); }
  function parseBackup(text) {
    let o;
    try { o = JSON.parse(String(text || "").trim()); } catch (e) { return { error: "That doesn't look like a Training Log backup. Copy the whole thing, including the { and } at each end." }; }
    if (!o || typeof o !== "object" || !COLS.some(c => o[c] && typeof o[c] === "object")) return { error: "That doesn't look like a Training Log backup." };
    const d = { exercises: {}, workouts: {}, logs: {} };
    COLS.forEach(c => {
      const src = o[c] && typeof o[c] === "object" && !Array.isArray(o[c]) ? o[c] : {};
      Object.entries(src).forEach(([id, v]) => { if (ID_OK.test(id) && v && typeof v === "object" && !Array.isArray(v)) d[c][id] = v; });
    });
    return { data: d };
  }
  async function restoreFrom(text, msgEl) {
    const r = parseBackup(text);
    const say = (t, bad) => { if (msgEl) { msgEl.textContent = t; msgEl.hidden = false; msgEl.style.color = bad ? "var(--critical)" : ""; } };
    if (r.error) { say(r.error, true); return false; }
    const n = { w: Object.keys(r.data.workouts).length, e: Object.keys(r.data.exercises).length, l: Object.keys(r.data.logs).length };
    const cur = LocalDB.counts();
    if (cur.workouts || cur.exercises || cur.logs) {
      const ok = await confirmDialog("Replace what's on this phone?", `This loads ${n.w} workout${n.w === 1 ? "" : "s"}, ${n.e} exercise${n.e === 1 ? "" : "s"} and ${n.l} logged session${n.l === 1 ? "" : "s"}, and replaces everything currently in the app.`, "Replace");
      if (!ok) return false;
    }
    await flush();
    try { LocalDB.replaceAll(r.data); } catch (e) { say("Couldn't save that on this phone. It may be out of storage space.", true); return false; }
    sess = null; drafts.clear();
    say(`Loaded ${n.w} workout${n.w === 1 ? "" : "s"}, ${n.e} exercise${n.e === 1 ? "" : "s"} and ${n.l} session${n.l === 1 ? "" : "s"}.`);
    setStatus("Restored", "ok");
    return true;
  }
  function markBackedUp() { store.set(LAST_BK, String(Date.now())); }
  function lastBackupText() {
    const t = +store.get(LAST_BK, "0");
    if (!t) return "Never";
    const days = Math.floor((Date.now() - t) / DAY);
    return days === 0 ? "Today" : days === 1 ? "Yesterday" : days + " days ago";
  }
  async function saveBackupFile() {
    const json = JSON.stringify(backupPayload());
    const name = `training-log-backup-${todayStr()}.json`;
    let file = null;
    try { file = new File([json], name, { type: "application/json" }); } catch (e) { file = null; }
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: "Training Log backup" }); markBackedUp(); return "Backup shared. Pick Save to Files to keep it on your phone or iCloud."; }
      catch (e) { if (e && e.name === "AbortError") return ""; }
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([json], { type: "application/json" })); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    markBackedUp(); return "Backup file saved.";
  }
  async function copyBackup() {
    const json = JSON.stringify(backupPayload());
    try { await navigator.clipboard.writeText(json); markBackedUp(); return "Copied. Paste it somewhere safe, like a note."; }
    catch (e) { return "Couldn't copy here. Use Save backup file instead."; }
  }
  let bkMsgs = { bkMsg: "", bkRMsg: "", bad: false };
  function renderBackup() {
    const c = LocalDB.counts();
    $("#pBackup").innerHTML = `<div class="crumbs"><a href="#workouts">← All workouts</a></div><div class="page-head"><div><h2 class="page-title">Backup &amp; restore</h2>
        <p class="sub">Your log is saved only on this phone. Save a backup now and then, and before you delete the app or switch phones.</p></div></div>
      <div class="stack">
        <div class="card">
          <h3 class="card-title">On this phone</h3>
          <p class="sub" style="margin-bottom:0">${c.workouts} workout${c.workouts === 1 ? "" : "s"} · ${c.exercises} exercise${c.exercises === 1 ? "" : "s"} · ${c.logs} logged session${c.logs === 1 ? "" : "s"} · Last backup: <strong>${esc(lastBackupText())}</strong></p>
        </div>
        <div class="card">
          <h3 class="card-title">Save a backup</h3>
          <p class="sub">Saves everything into one file you can keep in Files or iCloud Drive.</p>
          <div class="log-actions"><button type="button" class="btn primary" id="bkSave">Save backup file</button><button type="button" class="btn" id="bkCopy">Copy as text</button></div>
          <p class="help" id="bkMsg" ${bkMsgs.bkMsg ? "" : "hidden"}>${esc(bkMsgs.bkMsg)}</p>
        </div>
        <div class="card">
          <h3 class="card-title">Restore</h3>
          <p class="sub">Load a backup file, or paste backup text or a setup code. This replaces what's in the app now.</p>
          <div class="log-actions" style="margin-bottom:10px"><label class="btn" for="bkFile">Choose backup file</label><input type="file" id="bkFile" class="sr" accept=".json,application/json,text/plain"></div>
          <label class="lbl" for="bkText">Or paste it here</label>
          <textarea id="bkText" rows="4" placeholder="Paste backup text or your setup code"></textarea>
          <div class="log-actions" style="margin-top:10px"><button type="button" class="btn" id="bkRestore">Restore from pasted text</button></div>
          <p class="help" id="bkRMsg" ${bkMsgs.bkRMsg ? "" : "hidden"} style="${bkMsgs.bad ? "color:var(--critical)" : ""}">${esc(bkMsgs.bkRMsg)}</p>
        </div>
      </div>`;
  }
  const pB = $("#pBackup");
  async function restoreAndShow(text) {
    const tmp = document.createElement("p");
    const ok = await restoreFrom(text, tmp);
    bkMsgs = { bkMsg: "", bkRMsg: tmp.textContent, bad: !ok && !!tmp.textContent };
    if (ok) { const t = $("#bkText"); if (t) t.value = ""; }
    renderBackup();
  }
  pB.addEventListener("click", async e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.id === "bkSave") { const t = await saveBackupFile(); if (t) bkMsgs = { bkMsg: t, bkRMsg: "", bad: false }; renderBackup(); }
    else if (b.id === "bkCopy") { const t = await copyBackup(); bkMsgs = { bkMsg: t, bkRMsg: "", bad: false }; renderBackup(); }
    else if (b.id === "bkRestore") await restoreAndShow($("#bkText").value);
  });
  pB.addEventListener("change", async e => {
    if (e.target.id !== "bkFile" || !e.target.files || !e.target.files[0]) return;
    const text = await e.target.files[0].text(); e.target.value = "";
    await restoreAndShow(text);
  });

  async function init() {
    route();
    db = LocalDB;
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* not supported */ }
    subscribe("exercises", sEx);
    subscribe("workouts", sWk);
    subscribe("logs", sLog);
    if ("serviceWorker" in navigator && window.isSecureContext && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  init();
})();
</script>
</body>
